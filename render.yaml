services:
  - type: web
    name: royal-crown-salon-queue
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATA_DIR
        value: /var/data
    disk:
      name: salon-sqlite-disk
      mountPath: /var/data
      sizeGB: 1
